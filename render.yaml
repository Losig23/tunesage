services:
  - type: web
    name: tunesage
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Stable Flask secret for the deployed service (app sets
      # app.secret_key from this; ephemeral fallback is dev-only).
      - key: SECRET_KEY
        generateValue: true
