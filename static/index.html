<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TuneSage — AI Music Recommendations</title>
<style>
  :root { --bg:#0a0a0a; --card:#141414; --accent:#009473; --accent2:#34d399;
          --text:#f5f5f5; --muted:#9a9a9a; }
  * { box-sizing:border-box; }
  body { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg);
         color:var(--text); margin:0; padding:24px; min-height:100vh; }
  /* Ambient wallpaper: blurred gradient sampled from album art (JS). */
  #wallpaper { position:fixed; inset:0; z-index:-1; pointer-events:none;
         filter:blur(90px) saturate(1.35); opacity:.5; transition:background 1.2s ease;
         background:
           radial-gradient(60% 50% at 20% 10%, rgba(255,255,255,.05), transparent 60%),
           radial-gradient(50% 40% at 85% 20%, rgba(255,255,255,.04), transparent 60%),
           var(--bg); }
  .wrap { max-width:960px; margin:0 auto; }
  header { text-align:center; margin-bottom:28px; }
  header h1 { font-size:2.4rem; margin:0; color:var(--text); }
  header p { color:var(--muted); }
  section { background:rgba(20,20,20,.84); border-radius:16px; padding:20px;
            margin-bottom:20px; box-shadow:0 4px 24px rgba(0,0,0,.35);
            backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  h2 { margin-top:0; font-size:1.2rem; }
  form.log { display:grid; grid-template-columns:1fr 1fr 1fr 1fr auto; gap:8px; }
  input, button { padding:10px 12px; border-radius:8px; border:1px solid #2e2e2e;
                  background:#141414; color:var(--text); font-size:.95rem; }
  input:focus { outline:2px solid var(--accent); }
  button { background:var(--accent); border:none; cursor:pointer; font-weight:600; }
  button:hover { filter:brightness(1.15); }
  button.ghost { background:transparent; border:1px solid #2e2e2e; }
  button.small { padding:6px 10px; font-size:.8rem; }
  .track, .rec { display:flex; align-items:center; gap:14px; padding:12px 0;
                 border-bottom:1px solid #242424; }
  .track:last-child, .rec:last-child { border-bottom:none; }
  .rank { font-weight:700; color:var(--muted); width:28px; flex-shrink:0; }
  .meta { flex:1; min-width:0; }
  .meta .t { font-weight:600; }
  .meta .a { color:var(--muted); font-size:.85rem; }
  .plays { color:var(--muted); font-size:.85rem; white-space:nowrap; }
  .art { border-radius:12px; object-fit:cover; flex-shrink:0;
         box-shadow:0 4px 14px rgba(0,0,0,.45); background:#242424; }
  .art-fallback { display:flex; align-items:center; justify-content:center;
         border-radius:12px; flex-shrink:0; color:#0a0a0a; font-weight:700;
         background:linear-gradient(135deg,#2e2e2e,#3d3d3d);
         box-shadow:0 4px 14px rgba(0,0,0,.45); }
  .bar { height:8px; background:#242424; border-radius:4px; overflow:hidden;
         margin:6px 0; }
  .bar > div { height:100%; background:#8a8a8a; }
  .why { color:var(--muted); font-size:.85rem; font-style:italic; }
  .votes { display:flex; gap:6px; flex-shrink:0; }
  .voted { outline:3px solid #fff; outline-offset:2px; }
  .threads { color:var(--muted); font-size:.8rem; }
  .threads a { color:#b5b5b5; }
  .notice { background:#141414; border:1px solid #2e2e2e; border-radius:8px;
            padding:10px 14px; font-size:.85rem; margin-bottom:12px; }
  .scores { font-size:.75rem; color:var(--muted); }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin:2px 0 10px; }
  .tab { background:transparent; border:1px solid #2e2e2e; color:var(--muted);
         font-weight:600; }
  .tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .via { display:inline-block; font-size:.72rem; color:var(--muted);
         border:1px solid #2e2e2e; border-radius:20px; padding:2px 8px;
         margin-left:8px; vertical-align:middle; font-style:normal; }
  @media (max-width:640px){ form.log{ grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<div id="wallpaper"></div>
<div class="wrap">
  <header>
    <h1>🎧 TuneSage</h1>
    <p>Turn your listening history into picks with a hybrid AI engine.</p>
  </header>

  <section>
    <h2>➕ Log a listen</h2>
    <form class="log" id="logForm">
      <input id="fTitle" placeholder="Song title" required>
      <input id="fArtist" placeholder="Artist" required>
      <input id="fGenre" placeholder="Genre (optional)">
      <input id="fTags" placeholder="Mood tags, comma separated">
      <button type="submit">Log</button>
    </form>
  </section>

  <section>
    <h2>📻 Last.fm</h2>
    <div id="lastfmBody"><p class="threads">Loading…</p></div>
  </section>

  <section>
    <h2>🔥 Your top tracks <button class="ghost small" id="topToggle">Show all</button></h2>
    <div id="topTracks"><p class="threads">Loading…</p></div>
  </section>

  <section>
    <h2>✨ Recommendations <button class="ghost small" id="refreshBtn">↻ Refresh (re-mine)</button></h2>
    <div id="recNotice"></div>
    <div class="tabs" id="streamTabs"></div>
    <p class="threads" id="streamDesc"></p>
    <div id="recs"><p class="threads">Loading…</p></div>
    <h3 style="font-size:.95rem;color:var(--muted)">Sources mined</h3>
    <div id="threads" class="threads"></div>
    <p class="threads">Listening data by <a href="https://www.last.fm" target="_blank" rel="noopener">Last.fm</a> · Tempo data by <a href="https://getsongbpm.com" target="_blank" rel="noopener">GetSongBPM</a></p>
    <h3 style="font-size:.95rem;color:var(--muted)">Sources mined</h3>
    <div id="threads" class="threads"></div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

/* Album art: <img> when we have a URL, gradient ♪ placeholder otherwise. */
function artFail(el, size) {
  const d = document.createElement('div');
  d.className = 'art-fallback';
  d.style.width = d.style.height = size + 'px';
  d.style.fontSize = Math.round(size * 0.42) + 'px';
  d.textContent = '♪';
  el.replaceWith(d);
}
const artHTML = (url, size) => url
  ? `<img class="art" width="${size}" height="${size}" src="${esc(url)}" alt="" loading="lazy" onerror="artFail(this, ${size})">`
  : `<div class="art-fallback" style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.42)}px">♪</div>`;

/* Ambient wallpaper: sample the average color out of an artwork URL and
   paint a blurred gradient behind the page. Fails soft (CORS, broken URL)
   back to the default CSS gradient. */
function setWallpaper(url) {
  if (!url) return;
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    try {
      const c = document.createElement('canvas');
      c.width = c.height = 32;
      const x = c.getContext('2d');
      x.drawImage(img, 0, 0, 32, 32);
      const d = x.getImageData(0, 0, 32, 32).data;
      let r = 0, g = 0, b = 0, n = 0;
      for (let i = 0; i < d.length; i += 16) {
        r += d[i]; g += d[i + 1]; b += d[i + 2]; n++;
      }
      const hx = v => Math.round(v).toString(16).padStart(2, '0');
      const base = `#${hx(r / n)}${hx(g / n)}${hx(b / n)}`;
      const dark = `#${hx(r / n / 3)}${hx(g / n / 3)}${hx(b / n / 3)}`;
      $('wallpaper').style.background =
        `radial-gradient(70% 60% at 22% 12%, ${base}59, transparent 65%),` +
        `radial-gradient(55% 45% at 82% 22%, ${dark}99, transparent 60%), #0a0a0a`;
    } catch (e) { /* keep default gradient */ }
  };
  img.src = url;
}

/* "2026-10-19T13:46:50Z" -> "Oct 19, 2026, 8:46 AM CDT" */
const fmtCentral = iso => {
  try {
    return new Date(iso).toLocaleString('en-US', {
      timeZone: 'America/Chicago', month: 'short', day: 'numeric',
      year: 'numeric', hour: 'numeric', minute: '2-digit',
      timeZoneName: 'short'
    });
  } catch (e) { return iso; }
};

let topExpanded = false;
async function loadTop() {
  const { songs } = await api(`/api/listens/top?limit=${topExpanded ? 5000 : 10}`);
  $('topTracks').innerHTML = songs.length
    ? songs.map((s, i) => `
      <div class="track">${artHTML(s.image_url, 54)}<span class="rank">#${i + 1}</span>
        <div class="meta"><div class="t">${esc(s.title)}</div>
        <div class="a">${esc(s.artist)}${s.genre ? ' · ' + esc(s.genre) : ''}</div></div>
        <span class="plays">${s.play_count} plays</span></div>`).join('')
    : '<p class="threads">No listens yet — log your first song above!</p>';
  $('topToggle').textContent = topExpanded ? `Show less (${songs.length})` : 'Show all';
  const firstArt = (songs.find(s => s.image_url) || {}).image_url;
  setWallpaper(firstArt);
}
$('topToggle').addEventListener('click', () => { topExpanded = !topExpanded; loadTop(); });

const STREAM_TABS = [
  ['all', '✨ For you'],
  ['mainstream', '📈 Mainstream'],
  ['niche', '🪩 Niche'],
  ['underground', '🕳️ Underground'],
  ['upbeat', '⚡ Upbeat'],
  ['slowburn', '🌙 Slow burn'],
];
const STREAM_DESC = {
  all: 'Ranked for your taste across everything we found.',
  mainstream: 'Big, proven crowd-pleasers — the most-listened tracks among your candidates.',
  niche: 'Cult favorites — a solid following, not chart-toppers.',
  underground: 'Deep cuts — the least-heard tracks in your candidate pool. Highest discovery potential.',
  upbeat: 'High-energy picks — 120+ BPM, dancefloor territory.',
  slowburn: 'Downtempo and ballads — under 100 BPM.',
};
let lastRecs = null;
let activeStream = 'all';

function renderTabs() {
  const avail = ['all', 'mainstream', 'niche', 'underground'];
  if (lastRecs && lastRecs.tempo_available) avail.push('upbeat', 'slowburn');
  if (!avail.includes(activeStream)) activeStream = 'all';
  $('streamTabs').innerHTML = avail.map(k => {
    const label = STREAM_TABS.find(t => t[0] === k)[1];
    return `<button class="tab${k === activeStream ? ' active' : ''}" data-stream="${k}">${label}</button>`;
  }).join('');
  document.querySelectorAll('#streamTabs .tab').forEach(b =>
    b.addEventListener('click', () => { activeStream = b.dataset.stream; renderStream(); }));
}

function recCard(s, i) {
  return `
    <div class="rec">${artHTML(s.image, 72)}<span class="rank">#${i + 1}</span>
      <div class="meta">
        <div class="t">${esc(s.title)} <span class="a">— ${esc(s.artist)}</span>${s.via ? `<span class="via">via ${esc(s.via)}</span>` : ''}</div>
        <div class="bar"><div style="width:${Math.round(s.score * 100)}%"></div></div>
        <div class="scores">score ${s.score} · content ${s.content_score} · crowd ${s.forum_score} · feedback ${s.feedback_boost}${s.tempo ? ` · ${Math.round(s.tempo)} BPM` : ''}</div>
        <div class="why">${esc(s.why)}</div>
      </div>
      <div class="votes">
        <button class="small" onclick="vote('${jsq(s.title)}','${jsq(s.artist)}',true,this)">👍</button>
        <button class="small" onclick="vote('${jsq(s.title)}','${jsq(s.artist)}',false,this)">👎</button>
      </div></div>`;
}

function renderStream() {
  if (!lastRecs) return;
  renderTabs();
  const streams = lastRecs.streams || {};
  const songs = activeStream === 'all' ? lastRecs.songs
    : (streams[activeStream] || lastRecs.songs);
  $('streamDesc').textContent =
    (!lastRecs.streams && activeStream !== 'all')
      ? 'Streams need fresh data — hit Refresh (re-mine).'
      : (STREAM_DESC[activeStream] || '');
  $('recs').innerHTML = songs.length ? songs.map(recCard).join('')
    : (activeStream === 'all' || !lastRecs.songs.length
      ? '<p class="threads">Log some listens first, then come back for picks!</p>'
      : '<p class="threads">Nothing in this stream yet — hit Refresh (re-mine).</p>');
  document.querySelectorAll('#streamTabs .tab').forEach(b =>
    b.classList.toggle('active', b.dataset.stream === activeStream));
}

async function loadRecs(refresh = false) {
  $('recs').innerHTML = '<p class="threads">Mining candidates & scoring…</p>';
  const data = await api(`/api/recommendations?limit=10&refresh=${refresh ? 1 : 0}`);
  const srcNote = data.source === 'lastfm'
    ? `⛏️ Mined live from Last.fm — top tracks of artists similar to yours${data.cached ? ` (cached ${Math.round((data._cache_age_seconds||0)/60)} min ago)` : ''}.`
    : data.source === 'empty'
    ? '📭 No listening history yet — log or import some scrobbles.'
    : `⚠️ Live mining failed${data.mining_error ? ` (${esc(data.mining_error)})` : ''} — showing the sample dataset.`;
  $('recNotice').innerHTML = `<div class="notice">${srcNote}<br>
    Weights — content <b>${data.weights.w_content}</b> · crowd <b>${data.weights.w_forum}</b> · feedback <b>${data.weights.w_feedback}</b>
    (they adapt as you vote 👍/👎).${data.tempo_error ? `<br>⚠️ Tempo data unavailable (${esc(data.tempo_error)}).` : ''}</div>`;
  lastRecs = data;
  renderStream();
  const firstArt = ((data.songs || []).find(s => s.image) || {}).image;
  setWallpaper(firstArt);
  $('threads').innerHTML = (data.threads || []).map(t =>
    t.url ? `• <a href="${t.url}" target="_blank" rel="noopener">${esc(t.title)}</a>${t.subreddit ? ` <span>r/${esc(t.subreddit)}</span>` : ''}<br>`
          : `• ${esc(t.title)}<br>`).join('') || '<p>—</p>';
}

async function vote(title, artist, liked, btn) {
  await api('/api/feedback', { method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ song_title: title, artist, liked }) });
  btn.classList.add('voted');
  btn.parentElement.querySelectorAll('button').forEach(b => { if (b !== btn) b.classList.remove('voted'); });
}

$('logForm').addEventListener('submit', async e => {
  e.preventDefault();
  await api('/api/listens', { method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      title: $('fTitle').value, artist: $('fArtist').value,
      genre: $('fGenre').value,
      tags: $('fTags').value.split(',').map(t => t.trim()).filter(Boolean)
    }) });
  e.target.reset();
  loadTop();
});

$('refreshBtn').addEventListener('click', () => loadRecs(true));

async function loadLastfm() {
  let status;
  try {
    status = await api('/api/lastfm/status');
  } catch (e) {
    $('lastfmBody').innerHTML = '<p class="threads">Could not load Last.fm status.</p>';
    return;
  }
  if (!status.configured) {
    $('lastfmBody').innerHTML = `
      <p class="threads">Import your recent scrobbles automatically — no more manual logging.</p>
      <p class="threads">Setup: get a free API key at
        <a href="https://www.last.fm/api/account/create" target="_blank" rel="noopener">last.fm/api/account/create</a>,
        then set the <code>LASTFM_API_KEY</code> and <code>LASTFM_USERNAME</code>
        environment variables and restart the app.</p>`;
    return;
  }
  const last = status.last_import_at
    ? `Last import: ${fmtCentral(status.last_import_at)}` : 'No imports yet.';
  $('lastfmBody').innerHTML = `
    <p>Scrobbling as <b>${esc(status.username)}</b></p>
    <p class="threads">${esc(last)}</p>
    <button id="importBtn">⬇ Import recent scrobbles</button>
    <div id="importResult" class="threads" style="margin-top:10px"></div>`;
  $('importBtn').addEventListener('click', importLastfm);
}

async function importLastfm() {
  const btn = $('importBtn');
  btn.disabled = true;
  $('importResult').textContent = 'Importing…';
  try {
    const r = await api('/api/lastfm/import', { method: 'POST' });
    $('importResult').textContent =
      `Imported ${r.imported} new scrobble${r.imported === 1 ? '' : 's'}, skipped ${r.skipped} already-imported.`;
    loadTop();
  } catch (e) {
    $('importResult').textContent = 'Import failed: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}

// minimal escaping helpers
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const jsq = s => String(s ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");

loadTop();
loadRecs();
loadLastfm();
</script>
</body>
</html>
